[project]
name = "voiceflow"
version = "0.1.0"
description = "Fast, local push-to-talk dictation for macOS (a Wispr Flow-style tool)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caden Burleson" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "parakeet-mlx>=0.3.0",
    "mlx>=0.21.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "requests>=2.31",
]

[project.scripts]
voiceflow = "voiceflow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceflow"]
